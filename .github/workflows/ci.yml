name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify-web:
    name: Verify web
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: code/standup-bot-web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: code/standup-bot-web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: code/standup-bot-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      # `!cancelled()` so a type error doesn't hide the lint failures.
      - name: Lint
        if: ${{ !cancelled() }}
        run: pnpm run lint

      - name: No arbitrary Tailwind values
        if: ${{ !cancelled() }}
        run: |
          if grep -rnE '[a-z:-]+-\[[^]]+\]' src --include=*.tsx --exclude-dir=ui; then
            echo "::error::Arbitrary Tailwind values found (see AGENTS.md → Styling)."
            exit 1
          fi
